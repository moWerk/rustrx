# Rustrx: its call streams (role "phone") belong to the audio policy's
# "aliencall" group, the group of App Support's calls, so they stay on the
# route Rustrx picks during a call (earpiece or loudspeaker) instead of
# being moved to the loudspeaker as media.
[stream]
exe             = harbour-rustrx
property        = media.role@equals:"phone"
group           = aliencall
