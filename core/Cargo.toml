[package]
name = "rustrx-core"
version = "0.4.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Matrix core for Rustrx, a SailfishOS client: matrix-rust-sdk behind a small C ABI"

[lib]
name = "rustrx"
crate-type = ["cdylib"]

[dependencies]
matrix-sdk = { version = "0.19.1", default-features = false, features = [
    "e2e-encryption", "automatic-room-key-forwarding", "bundled-sqlite",
    "qrcode", "sso-login", "rustls-aws-lc-rs", "markdown", "experimental-widgets",
] }
matrix-sdk-ui = { version = "0.19.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
mime = "0.3"
mime_guess = "2"
anyhow = "1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "unwind"
