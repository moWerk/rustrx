[package]
name = "rustrx-core"
version = "0.8.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Matrix core for Rustrx, a SailfishOS client: matrix-rust-sdk behind a small C ABI"

[lib]
name = "rustrx"
crate-type = ["cdylib"]

[dependencies]
matrix-sdk = { version = "0.19.1", default-features = false, features = [
    "e2e-encryption", "automatic-room-key-forwarding", "bundled-sqlite",
    "qrcode", "sso-login", "rustls-aws-lc-rs", "markdown", "experimental-widgets",
] }
matrix-sdk-ui = { version = "0.19.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
mime = "0.3"
mime_guess = "2"
anyhow = "1"
# the QR code of a QR login, drawn by the UI (already in the tree through
# matrix-sdk's qrcode feature)
qrcode = { version = "0.14", default-features = false }
# reads the QR code the camera sees, for logging in or linking a device
rqrr = { version = "0.11", default-features = false }
# seals session.json with the store's key (in the tree through matrix-sdk's
# sqlite store; the version in Cargo.lock)
matrix-sdk-store-encryption = "=0.19.1"
# the crypto store's trait, to drop a classic sync's to-device position
# before sliding sync sends it (in the tree through matrix-sdk)
matrix-sdk-base = { version = "=0.19.1", default-features = false }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "unwind"
